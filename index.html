<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Moneda - Tomas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="converter-card">
        <div class="card-header">
            <h2>Convertidor de Moneda de Tomas</h2>
            <button id="themeToggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
        </div>
        
        <div class="form-group">
            <label for="inputExtranjera">Precio Moneda Extranjera (CLP)</label>
            <input type="number" id="inputExtranjera" placeholder="Ingrese monto" min="0" step="any">
        </div>
        
        <button class="btn-convert" onclick="convertirMoneda()">Convertir</button>
        
        <div class="results-box" id="resultsBox" style="display: none;">
            <div class="result-item">
                <span class="result-label">Precio en dólares:</span>
                <span class="result-value" id="usdResult">$ 0.00 USD</span>
            </div>
            <div class="result-item">
                <span class="result-label">Precio Local (ARS):</span>
                <span class="result-value" id="localResult">$ 0.00</span>
            </div>
        </div>

        <!-- Botón para mostrar/ocultar configuración -->
        <button class="config-toggle" onclick="toggleConfig()">⚙️ Ajustar cotizaciones</button>

        <!-- Panel de Configuración -->
        <div class="config-section" id="configSection">
            <div class="config-title">Configuración de Tasas (1 USD)</div>
            <div class="form-group">
                <label for="inputUsdExtranjera">Valor Dólar a Moneda Extranjera</label>
                <input type="number" id="inputUsdExtranjera" step="any">
            </div>
            <div class="form-group">
                <label for="inputUsdLocal">Valor Dólar a Moneda Local</label>
                <input type="number" id="inputUsdLocal" step="any">
            </div>
            <button class="btn-save" onclick="guardarConfiguracion()">Guardar Tasas</button>
        </div>
    </div>

    <footer>
        Esta familia es mil veces mejor gracias a Tomas
    </footer>

    <script src="script.js"></script>
</body>
</html>
